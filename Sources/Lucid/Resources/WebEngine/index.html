<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Document content must never run script: only the bundled engine files load, with no inline
       or eval'd code. Styles stay inline-capable for KaTeX, Mermaid SVG and user CSS. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' lucid-asset: data: blob: https: http:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucid Preview</title>
  <link rel="stylesheet" href="katex/katex.min.css">
  <link rel="stylesheet" href="highlight/highlight.min.css">
  <link rel="stylesheet" href="markdown-preview.css">
  <script src="markdown-it.min.js"></script>
  <script src="plugins/markdown-it-sub.min.js"></script>
  <script src="plugins/markdown-it-sup.min.js"></script>
  <script src="plugins/markdown-it-ins.min.js"></script>
  <script src="plugins/markdown-it-mark.min.js"></script>
  <script src="plugins/markdown-it-deflist.min.js"></script>
  <script src="plugins/markdown-it-abbr.min.js"></script>
  <script src="plugins/markdown-it-task-lists.min.js"></script>
  <script src="katex/katex.min.js"></script>
  <script src="katex/contrib/mhchem.min.js"></script>
  <script src="highlight/highlight.min.js"></script>
  <script src="mermaid/mermaid.min.js"></script>
  <script src="bridge.js"></script>
</head>
<body class="vscode-body">
  <div id="lucid-content"></div>
</body>
</html>
