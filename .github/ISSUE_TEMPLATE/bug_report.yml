name: Bug report
description: Report a problem with Lucid
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill out the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I…, Lucid… but I expected…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Switch to … mode
        3. See …
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample Markdown (if relevant)
      description: A minimal snippet that triggers the issue.
      render: markdown
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 14.5 (Sonoma)
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lucid version / commit
      placeholder: e.g. 1.0.0 or a git SHA
