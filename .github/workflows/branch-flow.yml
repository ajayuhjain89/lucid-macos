name: Branch Flow Policy

# Validates that every pull request uses an allowed source -> target direction,
# per docs/github_workflow.md §7. The workflow is direct-to-category, so most work
# needs no PR at all; this only guards the PRs that are opened. Maintainers can
# bypass by adding the "workflow:override" label (e.g. for maintenance merges).

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR direction
    runs-on: ubuntu-latest
    steps:
      - name: Check source -> target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'workflow:override') }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD_REF -> $BASE_REF"

          if [ "$HAS_OVERRIDE" = "true" ]; then
            echo "::warning::'workflow:override' label present — skipping branch-flow enforcement."
            exit 0
          fi

          # Temporary branches that may be taken into a category branch.
          is_temp=0
          case "$HEAD_REF" in
            experiment/*|prototype/*|migration/*|refactor/*) is_temp=1 ;;
          esac

          allowed=0
          case "$BASE_REF" in
            develop)
              # Verified category work integrates into develop.
              [[ "$HEAD_REF" == "logic" || "$HEAD_REF" == "design" || "$HEAD_REF" == "docs" ]] && allowed=1
              ;;
            main)
              # Only develop (or an emergency hotfix) promotes to main.
              [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == hotfix/* ]] && allowed=1
              ;;
            logic|design|docs)
              # Accepted temporary branches fold into a category branch.
              [ "$is_temp" = "1" ] && allowed=1
              ;;
          esac

          if [ "$allowed" = "1" ]; then
            echo "✅ Allowed PR direction: $HEAD_REF -> $BASE_REF"
            exit 0
          fi

          echo "::error::Disallowed PR direction: '$HEAD_REF' -> '$BASE_REF'."
          cat <<'EOF'
          Allowed directions (see docs/github_workflow.md §7):
            logic     -> develop
            design    -> develop
            docs      -> develop
            develop   -> main
            experiment/… | prototype/… | migration/… | refactor/…  -> logic | design | docs
            hotfix/…  -> main   (emergency)

          Normal work is committed directly on logic/design/docs (no task branch,
          no PR required). Only 'develop' may merge into 'main'. Maintainers may
          add the 'workflow:override' label to bypass this check when necessary.
          EOF
          exit 1
