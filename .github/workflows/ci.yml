name: CI

on:
  push:
    branches: [main, develop, design, logic, docs]
  pull_request:
    branches: [main, develop, design, logic, docs]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Compile optimized arm64 binary
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 -Xlinker -rpath -Xlinker @executable_path/../Frameworks
          # The output directory differs between SwiftPM build systems; ask SwiftPM for it.
          BIN="$(swift build -c release --arch arm64 -Xlinker -rpath -Xlinker @executable_path/../Frameworks --show-bin-path)"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          test -x "$BIN/Lucid" && echo "Lucid binary built successfully"

      - name: Assemble & sign app bundle
        run: |
          set -euo pipefail
          APP="/tmp/Lucid.app"; C="$APP/Contents"
          mkdir -p "$C/MacOS" "$C/Resources" "$C/Frameworks"
          cp "$BIN/Lucid" "$C/MacOS/Lucid"
          cp Info.plist "$C/Info.plist"
          echo "APPL????" > "$C/PkgInfo"
          [ -f AppIcon.icns ] && cp AppIcon.icns "$C/Resources/AppIcon.icns" || true
          cp -R Sources/Lucid/Resources/WebEngine "$C/Resources/WebEngine"
          cp -R "$BIN/Sparkle.framework" "$C/Frameworks/"
          codesign --force -s - "$C/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          codesign --force -s - "$C/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          codesign --force -s - "$C/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          codesign --force -s - "$C/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          codesign --force -s - "$C/Frameworks/Sparkle.framework/Versions/B"
          codesign --force -s - "$APP"
          codesign --verify --deep --strict "$APP" && echo "App bundle signed and verified"

      - name: Renderer regression suites (Node)
        run: |
          set -euo pipefail
          node --version
          for t in tests/test-*.js; do
            echo "==> $t"
            node "$t"
          done

      - name: Swift unit tests
        run: |
          set -euo pipefail
          # Swift Testing needs Xcode 16 or later; the runner's default Xcode may be older.
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          DEVELOPER_DIR="$XCODE/Contents/Developer" swift --version
          DEVELOPER_DIR="$XCODE/Contents/Developer" ./scripts/swift-test.sh

      - name: Diagnose native test failure
        if: failure() && matrix.os == 'macos-14'
        continue-on-error: true
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        run: |
          set -uo pipefail
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          export DEVELOPER_DIR="$XCODE/Contents/Developer"
          BIN="$(swift build --show-bin-path)"
          TEST_EXE="$BIN/LucidPackageTests.xctest/Contents/MacOS/LucidPackageTests"
          if [ ! -x "$TEST_EXE" ]; then TEST_EXE="$BIN/LucidPackageTests"; fi
          if [ -x "$TEST_EXE" ]; then
            lldb --batch -o "settings set target.process.stop-on-exec false" -o run -o "thread backtrace all" -- "$TEST_EXE" --testing-library swift-testing
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name '*Lucid*' -print -exec cat {} \;

      - name: Branch-flow policy suite
        run: bash tests/test-branch-flow-policy.sh

  build:
    name: Build (macOS, Apple Silicon)
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported macOS qualification
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
